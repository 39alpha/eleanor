default_language_version:
  python: python3.14

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      # Lint (pycodestyle E/W + Pyflakes F + isort I), with autofix.
      - id: ruff-check
        args: [--fix]
        files: ^eleanor/.*\.py$
      # Format (replaces yapf). Same scope as ruff-check.
      - id: ruff-format
        files: ^eleanor/.*\.py$

  - repo: local
    hooks:
      # Type-check eleanor/ with basedpyright (strict defaults).
      # Runs as a single invocation over the whole package
      # (pass_filenames: false) because pyright/basedpyright works best
      # at project granularity.
      - id: basedpyright
        name: basedpyright (eleanor)
        entry: uv run basedpyright eleanor
        language: system
        types: [python]
        files: ^eleanor/.*\.py$
        pass_filenames: false
