default_language_version:
  python: python3.14

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
        exclude: "^test/data"
      - id: trailing-whitespace
        exclude: "^test/data"
      - id: check-added-large-files

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^eleanor/.*\.py$
      - id: ruff-format
        files: ^eleanor/.*\.py$

  - repo: local
    hooks:
      - id: pyrefly
        name: pyrefly (eleanor)
        # No path argument: pyrefly then uses `project-includes` from
        # pyproject.toml, which is also what the language server reads. Passing
        # a path would switch it to single-file mode and ignore that config.
        entry: uv run pyrefly check
        language: system
        types: [python]
        files: ^eleanor/.*\.py$
        pass_filenames: false
