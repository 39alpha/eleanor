name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.14", "3.15" ]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # hatch-vcs needs full history + tags to derive the version.
          fetch-depth: 0

      - name: Install Fortran and Meson build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran meson ninja-build

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies (incl. dev group)
        run: uv sync --python ${{ matrix.python-version }} --group dev

      - name: Run pytest
        run: uv run --python ${{ matrix.python-version }} pytest -q
