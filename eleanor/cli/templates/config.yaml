# Eleanor configuration file
# See: https://github.com/39alpha/eleanor

# A list of blocks here writes to several sinks at once; give each a
# distinct `name` when two share a `kind`.
output:
  kind: postgres  # postgres | csv | null
  database:
    host: localhost
    port: 5432
    database: eleanor
    # username: eleanor
    # password: secret
    # sslmode: prefer

executor:
  kind: multiprocessing  # serial | multiprocessing
  chunks_per_worker: 10
