name: Lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install dev dependencies
        # --no-install-project skips building the Fortran kernel, which ruff
        # does not need.
        run: uv sync --python 3.14 --group dev --no-install-project

      # Tests are intentionally excluded for now — they aren't clean and we
      # don't want them blocking PRs.
      - name: Lint (ruff check)
        run: uv run --python 3.14 --no-project ruff check eleanor

      - name: Format check (ruff format --check)
        run: uv run --python 3.14 --no-project ruff format --check eleanor
