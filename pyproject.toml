[project]
name = "eleanor"
authors = [
  {name = "39 Alpha Research, Team Zero", email = "39alpha@39alpharesearch.org"},
]
description = "Large-scale, aqueous speciation modeling"
readme = "README.md"
license = {file = "LICENSE"}
dependencies = [
  "click>=8.1",
  'numpy',
  "pandas>=3.0.1",
  'psycopg[binary]>=3.1',
  'pyyaml',
  'scipy',
  # ``eleanor.progress`` rewrites tqdm's ``start_t`` / ``last_print_t``
  # internal timer attributes via a Protocol cast in ``_TimedBar``. These
  # have been stable across tqdm 4.x but a future major release could
  # rename them, in which case the listener would silently install
  # phantom attributes and display the wrong elapsed time. Pin to the
  # 4.x line until we add explicit version-aware fallbacks.
  'tqdm>=4.66,<5',
  'xdg-base-dirs',
]
requires-python = ">= 3.14"
dynamic = ["version"]

[project.urls]
Homepage = "https://39alpha.github.io/eleanor"
Documentation = "https://39alpha.github.io/eleanor"
Repository = "https://github.com/39alpha/eleanor.git"
Issues = "https://github.com/39alpha/eleanor/issues"
Changelog = "https://github.com/39alpha/eleanor/blob/master/CHANGELOG.md"

[project.scripts]
eleanor = "eleanor.cli:main"

[project.entry-points."eleanor.executors"]
serial = "eleanor.executor.factories:serial_spec"
multiprocessing = "eleanor.executor.factories:multiprocessing_spec"

[project.entry-points."eleanor.kernels"]
eq36 = "eleanor.kernel.factories:eq36_spec"

[project.entry-points."eleanor.navigators"]
random = "eleanor.navigator.factories:random_spec"
random_lattice = "eleanor.navigator.factories:random_lattice_spec"
lattice = "eleanor.navigator.factories:lattice_spec"

[project.entry-points."eleanor.outputs"]
csv = "eleanor.output.factories:csv_spec"
memory = "eleanor.output.factories:memory_spec"
"null" = "eleanor.output.factories:null_spec"
postgres = "eleanor.output.factories:postgres_spec"

[project.entry-points."eleanor.cli_commands"]
postgres = "eleanor.cli.factories:postgres_commands_spec"

[build-system]
requires = ["hatchling", "hatch-vcs", "hatch-build-scripts"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "eleanor/version.py"

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["test"]

[tool.ruff.lint]
extend-select = [
  "ANN",
  "ARG",
  "ASYNC",
  "B",
  "C4",
  # "C90", cyclomatic complexity (TBD, tricky)
  "COM",
  # "D", pydocstyle (TBD)
  # "DOC", pydoclint (TBD, requires preview)
  # "DTZ", datatimez (TBD, not sure what to do about timezones yet)
  "E",
  "EM",
  "ERA",
  "F",
  "FA",
  "FLY",
  "FURB",
  "G",
  "I",
  "ICN",
  "INP",
  "LOG",
  "N", # naming conventions
  "NPY",
  "PD",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "PYI",
  "Q",
  "R",
  "RET",
  "RUF",
  "SIM",
  # "SLF", private member access (TBD)
  "SLOT",
  # "T20", remove print (TBD, gotta implement logging)
  # "TC",  type checking rules (TBD, tried and failed)
  "TD",
  "TID",
  # "TRY", exception-related errors (TBD, are they worth the work?)
  "UP",
  "W",
]
ignore = [
  "COM812",  # trailing commas
  "E501",    # line-length
  "PLR0912", # (TBD) too many branches
  "PLR0913", # (TBD) too many arguments
  "PLR0915", # (TBD) too many statements
  "PLC0415", # import should be at top-level
  "SIM300",  # yoda conditions (sometimes they read better)
]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 80

[dependency-groups]
dev = [
    "basedpyright>=1.38.2",
    "codespell>=2.4.2",
    "ipython>=9.10.0",
    "pandas-stubs>=3.0.0.260204",
    "pre-commit>=4.6.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "pytest>=9.0.2",
    "python-lsp-isort>=0.2.1",
    "python-lsp-ruff>=2.3.1",
    "python-lsp-server>=1.14.0",
    "ruff>=0.15.0",
    "scipy-stubs>=1.17.1.4",
    "tomli-w>=1.2.0",
]

[[tool.hatch.build.targets.wheel.hooks.build-scripts.scripts]]
commands = [
  'meson setup --wipe build',
]
artifacts = []

[[tool.hatch.build.targets.wheel.hooks.build-scripts.scripts]]
out_dir = "eleanor/kernel/eq36/lib"
work_dir = "build"
commands = [
  'meson compile',
]
artifacts = ["*.so", "*.dylib"]
