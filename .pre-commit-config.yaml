default_language_version:
  python: python3.14

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      # Lint (pycodestyle E/W + Pyflakes F + isort I), with autofix.
      # Tests are intentionally excluded for now — they aren't clean and we
      # don't want them blocking commits.
      - id: ruff-check
        args: [--fix]
        files: ^eleanor/.*\.py$
      # Format (replaces yapf). Same scope as ruff-check.
      - id: ruff-format
        files: ^eleanor/.*\.py$

  - repo: local
    hooks:
      # Type-check eleanor/ with basedpyright. Runs as a single invocation
      # over the whole package (pass_filenames: false) because pyright/
      # basedpyright works best at project granularity. Tests are excluded
      # for the same reason as the ruff hooks above.
      - id: basedpyright
        name: basedpyright
        entry: uv run basedpyright eleanor
        language: system
        types: [python]
        files: ^eleanor/.*\.py$
        pass_filenames: false
